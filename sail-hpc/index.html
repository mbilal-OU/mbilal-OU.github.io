<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0e12">
  <meta name="description" content="SAIL-HPC interactive development preview.">
  <title>SAIL-HPC | Loading current preview</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e12;--panel:#12171d;--line:#2b333e;--text:#eef2f6;--muted:#a8b2bd;--accent:#f29a38}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loader{width:min(560px,calc(100% - 2rem));padding:1.5rem;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
    .brand{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem}.mark{width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(242,154,56,.55);border-radius:12px;background:rgba(242,154,56,.1);color:var(--accent);font-weight:800}.brand strong{font-size:1.1rem}.loader p{color:var(--muted);margin:.5rem 0 0}.error{color:#ff9b9b}.retry{display:inline-block;margin-top:1rem;color:var(--accent)}
  </style>
</head>
<body>
  <main class="loader" aria-live="polite">
    <div class="brand"><div class="mark">S</div><strong>SAIL-HPC</strong></div>
    <strong>Loading the current interactive release candidate…</strong>
    <p id="status">Fetching the latest publication build.</p>
  </main>
  <script>
  (async () => {
    const BUILD = "depth4-20260827";
    const source = `/FORGE-Slurm-Lab/index.html?preview=${BUILD}`;
    const status = document.getElementById("status");
    try {
      const response = await fetch(source, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      let html = await response.text();
      if (!html.includes("SAIL-HPC")) throw new Error("The publication deployment did not return SAIL-HPC.");
      html = html.replace("<head>", `<head><base href="/FORGE-Slurm-Lab/">`);
      html = html.replace('href="assets/css/sail.css"', `href="assets/css/sail.css?rc=${BUILD}"`);
      html = html.replace('href="assets/img/favicon.svg"', `href="assets/img/favicon.svg?rc=${BUILD}"`);
      html = html.replace('src="src/ui/app.js"', `src="src/ui/app.js?rc=${BUILD}"`);
      html = html.replace('src="src/ui/script-launcher.js"', `src="src/ui/script-launcher.js?rc=${BUILD}"`);
      html = html.replace('src="src/ui/certificate-final.js"', `src="src/ui/certificate-final.js?rc=${BUILD}"`);
      html = html.replace("</body>", `<div data-sail-preview-build="${BUILD}" hidden></div></body>`);
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      status.className = "error";
      status.textContent = `Could not load the current SAIL-HPC preview: ${error.message}`;
      const retry = document.createElement("a");
      retry.className = "retry";
      retry.href = location.href;
      retry.textContent = "Retry";
      status.after(retry);
    }
  })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e12">
  <title>SAIL-HPC Depth8</title>
  <style>html,body{margin:0;min-height:100%;background:#070b0f;color:#eef2f6;font-family:Arial,Helvetica,sans-serif}main{min-height:100vh;display:grid;place-items:center}.load{max-width:560px;padding:36px;text-align:center}.load strong{font-size:28px}.load p{color:#a8b2bd}</style>
</head>
<body>
<main><div class="load"><strong>SAIL-HPC</strong><p>Loading the integrated learning workspace…</p></div></main>
<script>
(async () => {
  try {
    const token = 'depth8-20260828';
    const response = await fetch('../index.html?source=' + token + '-' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('Unable to load SAIL-HPC source');
    let html = await response.text();
    html = html.replace('<head>', '<head><base href="/sail-hpc/"><link rel="stylesheet" href="assets/css/workspace-depth8.css?v=' + token + '">');
    html = html.replace(/\s*<script type="module" src="src\/ui\/learning-depth\.js[^>]*><\/script>/, '');
    html = html.replace('src/ui/certificate-final.js?v=depth6-20260828', 'src/ui/certificate-final.js?v=depth7-20260828');
    html = html.replace('</body>', '<script type="module" src="src/ui/workspace-depth8.js?v=' + token + '"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<main><div class="load"><strong>SAIL-HPC could not load.</strong><p>The live build failed to initialize. Please report this screen.</p></div></main>';
  }
})();
</script>
</body>
</html>

dius:9px;padding:10px}.command strong{display:block}.command p{font-size:10px;color:var(--muted);min-height:28px}.command code{display:block;background:#030709;color:#ffe0a7;padding:7px;border-radius:6px;font-size:10px;overflow:hidden}.right{display:grid;gap:10px;align-content:start}.right .card{padding:12px}.right h3{font-size:12px;margin:0 0 8px}.right p,.right li{font-size:10px;color:var(--muted);line-height:1.5}.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.practice-grid{display:grid;grid-template-columns:minmax(0,1.3fr) 380px;gap:12px}.terminal{background:var(--term);border:1px solid #2a3a44;border-radius:12px;overflow:hidden}.term-head{padding:10px 12px;background:#0b151a;border-bottom:1px solid #1f2d35;display:flex;justify-content:space-between;font-size:11px}.term-body{min-height:420px;max-height:520px;overflow:auto;padding:12px;font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap}.prompt{color:var(--green)}.term-form{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:10px 12px;border-top:1px solid #1f2d35}.term-form input{background:#020608;color:white;border:1px solid #2b3a43;border-radius:7px;padding:9px}.catalog-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.catalog-tabs button{border:1px solid #31434e;background:#101a20;color:#bcc7cf;border-radius:999px;padding:6px 9px;font-size:10px}.catalog-tabs button.active{border-color:var(--orange);color:#fff}.catalog{display:grid;gap:7px;max-height:520px;overflow:auto}.catalog button{border:1px solid #263943;background:#0d171d;color:#e8eef2;border-radius:8px;padding:10px;text-align:left}.catalog code{display:block;color:#ffd79f}.catalog span{font-size:10px;color:var(--muted)}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.scenario{padding:15px}.scenario h3{margin:5px 0}.scenario p{font-size:11px;color:var(--muted);line-height:1.5}.builder-grid{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(380px,.9fr);gap:12px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fields label{font-size:10px;color:#aeb9c1}.fields input,.fields textarea,.fields select{width:100%;margin-top:5px;background:#081116;color:#eef3f7;border:1px solid #2b3a44;border-radius:8px;padding:10px}.fields textarea{min-height:100px}.full{grid-column:1/-1}.script{background:#020608;border:1px solid #263740;border-radius:8px;padding:12px;min-height:390px;color:#dce7ed;font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap}.assessment-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.stage{border:1px solid #2a3a44;background:#0f191f;border-radius:8px;padding:9px;text-align:center;font-size:10px;color:#aebac2}.stage.active{border-color:var(--orange);color:#fff;background:#24190e}.qcard{border:1px solid #273943;background:#0f191f;border-radius:10px;padding:15px}.qcard label{display:block;margin:8px 0;font-size:11px}.qcard input[type=text],.qcard textarea{width:100%;background:#04090c;border:1px solid #2c3c45;color:#eef3f7;border-radius:8px;padding:10px}.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editor{width:100%;min-height:280px;background:#020608;color:#eef3f7;border:1px solid #2a3a44;border-radius:8px;padding:12px;font:12px/1.55 ui-monospace,Consolas,monospace}.big{font-size:44px;font-weight:950;color:var(--orange)}.certificate{display:none;margin-top:14px;padding:28px;background:#f7f5ef;color:#101820;border:6px solid #111820;border-radius:12px;outline:2px solid #f29a38;outline-offset:-14px}.certificate.show{display:block}.footer{border-top:1px solid var(--line);padding:12px 20px;color:#8797a2;font-size:10px;display:flex;justify-content:space-between}@media(max-width:1180px){.learn-grid{grid-template-columns:220px 1fr}.right{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}.builder-grid{grid-template-columns:220px 1fr}.script-panel{grid-column:1/-1}.route-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:800px){.brand{min-width:0}.brand small,.badge{display:none}.nav{overflow:auto}.hero,.learn-grid,.practice-grid,.builder-grid,.assessment-grid,.project-grid,.fields,.scenario-grid{grid-template-columns:1fr}.right,.command-grid,.route-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>

<body>
<header class="topbar"><div class="brand"><svg viewBox="0 0 64 64" aria-label="SAIL-HPC geometric logo"><g fill="none" stroke="#9faab2" stroke-width="2"><path d="M32 5 54 18v28L32 59 10 46V18Z"/><path d="M32 5v54M10 18l22 13 22-13M10 46l22-13 22 13"/></g><path d="M32 31 54 18v28L32 59Z" fill="#f29a38" opacity=".9"/></svg><div><strong>SAIL-HPC</strong><small>Simulation-Augmented Interactive Learning for High-Performance Computing</small></div></div><span class="badge">SIMULATION ONLY · NO REAL JOBS</span><nav class="nav" id="nav"></nav></header>
<main id="app"></main>
<footer class="footer"><span>SAIL-HPC v6 · deterministic educational simulation</span><span>No credentials · no production Slurm · no real resource consumption</span></footer>
<script>
const VIEWS=['home','learn','practice','scenarios','builder','assessment'];
const LABELS={home:'Home',learn:'Learn',practice:'Practice',scenarios:'Scenarios',builder:'Builder',assessment:'Certificate'};
const S={view:'home',lesson:0,tab:'concept',cat:0,builderStep:0,q:0,stage:'questions',answers:Array(20).fill('')};
history.scrollRestoration='manual';
function topNow(){document.documentElement.scrollTop=0;document.body.scrollTop=0;window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0));}
function nav(v){S.view=v;render();topNow();}
function renderNav(){const n=document.getElementById('nav');n.innerHTML='';VIEWS.forEach(v=>{const b=document.createElement('button');b.textContent=LABELS[v];b.className=S.view===v?'active':'';b.onclick=()=>nav(v);n.appendChild(b)})}
const LESSONS=[
['What is an HPC cluster?','Login nodes, compute nodes, storage and scheduler boundaries.'],['Login vs compute node','Know where interactive preparation ends and scheduled compute begins.'],['What Slurm does','Requests, allocation, states and accounting.'],['Partitions and resources','CPU, memory, walltime, GPUs and site policy.'],['Your first batch script','Shebang, #SBATCH directives, environment and command.'],['Modules and Conda','Reproducible software environments.'],['Monitor a job','Use squeue, scontrol, sacct and seff appropriately.'],['Why jobs stay pending','Resources, priority, dependencies and policy.'],['Job arrays','Scale repeated tasks safely.'],['Dependencies','Connect workflow stages with afterok and related conditions.'],['OOM and TIMEOUT','Diagnose failures from evidence.'],['Accounting and revision','Use observed utilization to right-size requests.'],['Moving to a real cluster','Transfer safely using site documentation.']];
const COMMANDS={
'Discover & orient':[['sinfo','Inspect partitions and node state'],['sinfo -o "%P %a %l %D %T"','Custom partition view'],['scontrol show partition','Inspect partition configuration'],['scontrol show config','Reference cluster configuration'],['squeue','Inspect queue']],
'Submit & interactive':[['sbatch job.sh','Submit a batch script'],['sbatch --parsable job.sh','Return job ID cleanly'],['srun --pty bash','Interactive step (reference-only)'],['salloc','Interactive allocation (reference-only)']],
'Queue & inspect':[['squeue -u $USER','Your jobs'],['squeue -j 73001','One job'],['scontrol show job 73001','Detailed job record'],['squeue --start -j 73002','Estimated start when supported'],['sprio -j 73002','Priority components']],
'Accounting':[['sacct -j 73001','Completed/running accounting'],['sacct -X -j 73001','Allocation-level records'],['seff 73001','Efficiency summary'],['sstat -j 73001.batch','Running-job statistics'],['sshare','Fair-share information (site-dependent)']],
'Control':[['scancel 73001','Cancel job'],['scontrol hold 73001','Hold pending job'],['scontrol release 73001','Release held job'],['scontrol requeue 73001','Requeue when permitted']],
'Environment':[['module avail','List modules'],['module spider','Search module tree'],['module load IQ-TREE','Load software'],['module list','Loaded modules'],['conda activate env','Activate environment'],['which python','Resolve executable'],['python --version','Verify version']],
'Files & logs':[['pwd','Current path'],['ls -lh','List files'],['mkdir -p logs','Create log directory'],['tail -f logs/job.out','Follow output'],['less logs/job.err','Inspect error log'],['du -sh .','Disk usage'],['quota -s','Quota where available']],
'Arrays & dependencies':[['sbatch --array=1-12%3 qc.sh','Array with concurrency cap'],['echo $SLURM_ARRAY_TASK_ID','Array task ID'],['sbatch --dependency=afterok:73001 summary.sh','Submit dependent stage'],['squeue --array','Array-oriented queue view']]
};
const SCEN=[['Alignment OOM','Memory-sensitive alignment requiring evidence-based revision','alignment'],['FASTQ QC array','12-sample FastQC array with %3 concurrency','array'],['RNA-seq dependency','Downstream summary after upstream success','dep'],['Bacterial pangenome','Threaded Roary workload','pan'],['GPU molecular dynamics','Single-GPU modeled workload','gpu'],['Walltime failure','TIMEOUT diagnosis and revision','time']];
let B={job:'analysis',partition:'compute',nodes:'1',ntasks:'1',cpus:'8',mem:'16G',time:'02:00:00',command:'python3 analysis.py input.tsv output.tsv',workdir:'$HOME/project',modules:'Python',conda:'',env:'OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK',stdout:'logs/%x-%j.out',stderr:'logs/%x-%j.err',account:'',qos:'',gpu:'',constraint:'',array:'',dependency:'',mailtype:'',mailuser:''};
const Q=[
['mcq','Which command submits a batch script?',['squeue','sbatch','sacct'],'sbatch'],['text','Exact command to inspect partitions','sinfo'],['text','Exact directive requesting 8 CPUs/task','#SBATCH --cpus-per-task=8'],['mcq','A job exceeds requested memory. Likely state?',['OOM','PENDING','HELD'],'OOM'],['text','Exact command to inspect job 73001','scontrol show job 73001'],['text','Exact command to cancel 73001','scancel 73001'],['mcq','Best evidence after completion?',['sacct/seff','ls','pwd'],'sacct/seff'],['text','Exact 12-task array capped at 3','#SBATCH --array=1-12%3'],['text','Exact afterok dependency on 73001','#SBATCH --dependency=afterok:73001'],['mcq','Requesting 8 CPUs automatically creates 8 threads?',['Yes','No'],'No'],['text','Environment variable tying OpenMP to allocation','OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK'],['mcq','Where should heavy compute normally run?',['Login node','Allocated compute node'],'Allocated compute node'],['text','Exact 20 GB memory directive','#SBATCH --mem=20G'],['text','Exact 2-hour walltime directive','#SBATCH --time=02:00:00'],['mcq','Which is site-specific?',['Account/QOS','Shebang'],'Account/QOS'],['text','Exact command for your jobs','squeue -u $USER'],['mcq','afterok means downstream starts when upstream...',['succeeds','starts','is pending'],'succeeds'],['text','Exact stdout pattern using job name and ID','logs/%x-%j.out'],['mcq','SAIL-HPC actually submits to production Slurm?',['Yes','No'],'No'],['text','Exact command to inspect efficiency of 73001','seff 73001']];
let P1='#!/bin/bash\n#SBATCH --job-name=qc\n',P2='#!/bin/bash\n#SBATCH --job-name=summary\n',PD='';let TC={partition:false,account:false,module:false,paths:false};
function render(){renderNav();const a=document.getElementById('app');a.innerHTML=S.view==='home'?home():S.view==='learn'?learn():S.view==='practice'?practice():S.view==='scenarios'?scenarios():S.view==='builder'?builder():assessment();wire();}
function home(){return `<section class="home"><div class="home-inner"><div class="hero"><div><div class="eyebrow">Scientific HPC learning environment</div><h1>Learn. Build.<br>Diagnose.<br><span>Transfer with confidence.</span></h1><p>Practice Slurm concepts, commands, job construction, monitoring and diagnosis in a deterministic browser-first environment.</p></div><div class="notice"><strong>Simulation only.</strong><br>SAIL-HPC does not connect to production Slurm, submit real jobs, consume cluster resources or collect HPC credentials.</div></div><div class="route-grid">${route('>_','I have my own pipeline','Translate a scientific command or workflow into a Slurm-ready request.','Builder','builder')}${route('▣','I want to learn','Follow the 13-module path from HPC basics to real-cluster transfer.','Start learning','learn')}${route('>_','I want to practice','Use the simulated terminal and broad command catalog.','Start practice','practice')}${route('◎','I want to test myself','Complete 20 tasks plus a full end-to-end capstone project.','Start assessment','assessment')}</div></div></section>`}
function route(i,h,p,b,v){return `<article class="card route"><div class="ico">${i}</div><h2>${h}</h2><p>${p}</p><button class="primary" data-nav="${v}">${b} →</button></article>`}
function head(k,h,p){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div><div class="notice"><strong>Simulated environment:</strong> outputs are modeled; no real scheduler actions occur.</div></div>`}
function learn(){let l=LESSONS[S.lesson];return `<div class="shell">${head('Guided curriculum','Learn Slurm by doing','13 modules with concepts, commands, hands-on practice and transfer guidance.')}<div class="learn-grid"><aside class="card sidebar"><div class="eyebrow">13 modules</div><div class="lesson-list">${LESSONS.map((x,i)=>`<button class="lesson-btn ${i===S.lesson?'active':''}" data-lesson="${i}">${i+1}. ${x[0]}</button>`).join('')}</div></aside><section class="card main"><div class="eyebrow">Lesson ${S.lesson+1} of 13</div><h2>${l[0]}</h2><p class="muted">${l[1]}</p><div class="tabs">${['concept','commands','hands','transfer'].map(t=>`<button class="${S.tab===t?'active':''}" data-tab="${t}">${{concept:'Concept',commands:'Commands & literacy',hands:'Hands-on',transfer:'Transfer tips'}[t]}</button>`).join('')}</div>${lessonPanel()}<div class="stepnav"><button class="secondary" data-prev-lesson>← Previous lesson</button><button class="primary" data-next-lesson>Next lesson →</button></div></section><aside class="right"><div class="card"><h3>Learning objective</h3><p>${l[1]}</p></div><div class="card"><h3>Remember</h3><ul><li>Requests are not usage.</li><li>Site policy varies.</li><li>Evidence should drive revisions.</li></ul></div><div class="card"><h3>Transfer rule</h3><p>Verify partition, account/QOS, modules, paths and limits in your institution's documentation.</p></div></aside></div></div>`}
function lessonPanel(){if(S.tab==='concept')return `<div class="card" style="padding:14px"><h3>Core idea</h3><p class="muted">${LESSONS[S.lesson][1]}</p><p>This lesson connects the conceptual model to the exact Slurm objects and commands you will use later.</p></div>`;if(S.tab==='commands'){let all=Object.values(COMMANDS).flat().slice(Math.max(0,S.lesson*2-2),Math.max(0,S.lesson*2-2)+6);return `<div class="command-grid">${all.map(c=>`<div class="command"><strong>${c[0]}</strong><p>${c[1]}</p><code>${c[0]}</code></div>`).join('')}</div>`}if(S.tab==='hands')return `<div class="card" style="padding:14px"><h3>Hands-on task</h3><p class="muted">Open Practice, run the relevant command, inspect the modeled output, then explain what evidence you would verify on a real cluster.</p><button class="primary" data-nav="practice">Open Practice →</button></div>`;return `<div class="notice"><strong>Transfer tip:</strong> Never copy site-specific partitions, accounts, QOS, modules, paths or limits blindly. Export the pattern, then adapt it to local documentation.</div>`}
function practice(){let names=Object.keys(COMMANDS),name=names[S.cat];return `<div class="shell">${head('Practice','Command fluency','A broad Slurm/HPC command catalog with selected deterministic simulations and honest reference-only behavior.')}<div class="practice-grid"><section class="terminal"><div class="term-head"><span>SAIL-HPC terminal · simulated</span><span>no real shell</span></div><div class="term-body" id="term"><span class="prompt">sail-hpc:~$</span> sinfo\nPARTITION AVAIL NODES STATE\nshort up 4 mix\ncompute up 6 idle\n[SIMULATED OUTPUT]</div><div class="term-form"><span class="prompt">$</span><input id="cmd" placeholder="Type or insert a command"><button class="primary" id="run">Run</button></div></section><aside class="card practice-side"><div class="eyebrow">Command catalog</div><div class="catalog-tabs">${names.map((n,i)=>`<button class="${i===S.cat?'active':''}" data-cat="${i}">${n}</button>`).join('')}</div><div class="catalog">${COMMANDS[name].map(c=>`<button data-insert="${esc(c[0])}"><code>${c[0]}</code><span>${c[1]}</span></button>`).join('')}</div><div class="stepnav"><button class="secondary" data-prev-cat>← Previous group</button><button class="primary" data-next-cat>Next group →</button></div></aside></div></div>`}
function scenarios(){return `<div class="shell">${head('Scientific scenarios','Practice recognizable workloads','Load a scenario into the full Builder, inspect the generated script and revise it.')}<div class="scenario-grid">${SCEN.map(s=>`<article class="card scenario"><div class="eyebrow">${s[2]}</div><h3>${s[0]}</h3><p>${s[1]}</p><button class="primary" data-scenario="${s[2]}">Load into Builder →</button></article>`).join('')}</div></div>`}
function builder(){return `<div class="shell">${head('Full Slurm Builder','Construct a transparent batch request','Resources, environment, paths, advanced directives and a live generated script. Nothing is submitted.')}<div class="builder-grid"><aside class="card builder-side"><div class="eyebrow">Builder steps</div>${['Resources','Environment & paths','Advanced options','Review & export'].map((x,i)=>`<button class="step-btn ${i===S.builderStep?'active':''}" data-bstep="${i}" style="margin-top:7px">${i+1}. ${x}</button>`).join('')}</aside><section class="card builder-main">${builderPane()}<div class="stepnav"><button class="secondary" data-prev-builder>← Back</button><button class="primary" data-next-builder>Next →</button></div></section><aside class="card script-panel"><div class="eyebrow">Generated script</div><h3>job.sh</h3><pre class="script" id="script">${esc(scriptText())}</pre><p class="muted" style="font-size:10px">Generated locally. Not submitted or executed.</p></aside></div></div>`}
function field(k,l,v){return `<label>${l}<input data-b="${k}" value="${esc(v)}"></label>`}
function builderPane(){if(S.builderStep===0)return `<div class="eyebrow">Step 1</div><h2>Resources</h2><div class="fields">${field('job','Job name',B.job)}${field('partition','Partition',B.partition)}${field('nodes','Nodes',B.nodes)}${field('ntasks','Tasks',B.ntasks)}${field('cpus','CPUs/task',B.cpus)}${field('mem','Memory',B.mem)}${field('time','Walltime',B.time)}<label class="full">Command<textarea data-b="command">${esc(B.command)}</textarea></label></div>`;if(S.builderStep===1)return `<div class="eyebrow">Step 2</div><h2>Environment & paths</h2><div class="fields">${field('workdir','Working directory',B.workdir)}${field('conda','Conda environment',B.conda)}<label class="full">Modules<textarea data-b="modules">${esc(B.modules)}</textarea></label><label class="full">Environment variables<textarea data-b="env">${esc(B.env)}</textarea></label>${field('stdout','Stdout',B.stdout)}${field('stderr','Stderr',B.stderr)}</div>`;if(S.builderStep===2)return `<div class="eyebrow">Step 3</div><h2>Advanced scheduler options</h2><div class="fields">${field('account','Account',B.account)}${field('qos','QOS',B.qos)}${field('gpu','GRES / GPU',B.gpu)}${field('constraint','Constraint',B.constraint)}${field('array','Array',B.array)}${field('dependency','Dependency',B.dependency)}${field('mailtype','Mail type',B.mailtype)}${field('mailuser','Mail user',B.mailuser)}</div>`;return `<div class="eyebrow">Step 4</div><h2>Review before export</h2><div class="notice"><strong>Still simulated:</strong> this script has not been submitted anywhere.</div><p class="muted">Verify CPU/application threading, memory, walltime, account/QOS, modules, paths, logs, arrays/dependencies and GPU syntax against the target institution.</p>`}
function scriptText(){let x=`#!/bin/bash\n#SBATCH --job-name=${B.job}\n#SBATCH --partition=${B.partition}\n#SBATCH --nodes=${B.nodes}\n#SBATCH --ntasks=${B.ntasks}\n#SBATCH --cpus-per-task=${B.cpus}\n#SBATCH --mem=${B.mem}\n#SBATCH --time=${B.time}\n#SBATCH --output=${B.stdout}\n#SBATCH --error=${B.stderr}\n`;[['account','account'],['qos','qos'],['gpu','gres'],['constraint','constraint'],['array','array'],['dependency','dependency'],['mailtype','mail-type'],['mailuser','mail-user']].forEach(([k,d])=>{if(B[k])x+=`#SBATCH --${d}=${B[k]}\n`});x+=`\nmkdir -p logs\ncd "${B.workdir}"\n`;B.modules.split(/\n+/).filter(Boolean).forEach(m=>x+=`module load ${m}\n`);if(B.conda)x+=`conda activate ${B.conda}\n`;B.env.split(/\n+/).filter(Boolean).forEach(e=>x+=`export ${e}\n`);return x+`\n${B.command}\n`}
function assessment(){return `<div class="shell">${head('Project-based certification','Practical Readiness Examination','20 mixed tasks plus a complete two-stage HPC project. Certificate unlocks only at 100/100.')}<div class="assessment-grid"><section class="card assessment-main"><div class="stages">${['questions','project','results','certificate'].map((x,i)=>`<div class="stage ${S.stage===x?'active':''}">${i+1}. ${x}</div>`).join('')}</div>${assessmentBody()}</section><aside class="card assessment-side"><div class="eyebrow">Scoring</div><div class="big">${scoreTotal()}/100</div><p class="muted">20 tasks: 60 points<br>Capstone: 40 points</p><div class="notice"><strong>Certificate gate:</strong> exactly 100/100.</div></aside></div></div>`}
function assessmentBody(){if(S.stage==='questions'){let q=Q[S.q];return `<div class="qcard"><div class="eyebrow">Task ${S.q+1} of 20 · 3 points</div><h3>${q[1]}</h3>${q[0]==='mcq'?q[2].map(o=>`<label><input type="radio" name="qa" value="${esc(o)}" ${S.answers[S.q]===o?'checked':''}> ${o}</label>`).join(''):`<input type="text" id="qaText" value="${esc(S.answers[S.q])}" placeholder="Type the exact command/directive">`}</div><div class="stepnav"><button class="secondary" data-qprev>← Previous</button><button class="primary" data-qnext>${S.q===19?'Continue to project →':'Next task →'}</button></div>`}if(S.stage==='project')return `<div class="eyebrow">Final capstone · 40 points</div><h2>Two-stage genomics QC workflow</h2><div class="notice"><strong>Built locally only.</strong> These files are never submitted by SAIL-HPC.</div><div class="project-grid"><div><h3>01_qc_array.sh</h3><textarea id="p1" class="editor">${esc(P1)}</textarea></div><div><h3>02_summary.sh</h3><textarea id="p2" class="editor">${esc(P2)}</textarea></div></div><h3>03_diagnosis.md</h3><textarea id="pd" class="editor" style="min-height:150px">${esc(PD)}</textarea><h3>Real-cluster transfer checklist</h3>${[['partition','Partition/limits verified'],['account','Account/QOS verified'],['module','Modules/software verified'],['paths','Paths/permissions/quota verified']].map(([k,l])=>`<label style="display:block;margin:7px 0"><input type="checkbox" data-tc="${k}" ${TC[k]?'checked':''}> ${l}</label>`).join('')}<div class="stepnav"><button class="secondary" data-projback>← Back to tasks</button><button class="primary" data-projscore>Score project →</button></div>`;if(S.stage==='results')return `<div class="eyebrow">Results</div><h2>${scoreTotal()===100?'Perfect completion':'Not yet complete'}</h2><div class="big">${scoreTotal()}/100</div><p class="muted">Return to any missed tasks or revise the capstone until every requirement is satisfied.</p><div class="stepnav"><button class="secondary" data-resultback>← Revise project</button><button class="primary" data-cert ${scoreTotal()===100?'':'disabled'}>Open certificate →</button></div>`;return `<div class="certificate ${scoreTotal()===100?'show':''}"><div class="eyebrow">SAIL-HPC</div><h2>Certificate of Practice Completion</h2><p>This certifies successful completion of the SAIL-HPC Practical Readiness Examination and capstone project.</p><h3>Score: 100/100</h3><p>Simulation-Augmented Interactive Learning for High-Performance Computing</p></div><button class="primary" onclick="window.print()">Print / Save PDF</button>`}
function scoreQuestions(){let s=0;Q.forEach((q,i)=>{let a=(S.answers[i]||'').trim();if(q[0]==='mcq'&&a===q[3])s+=3;if(q[0]==='text'&&norm(a)===norm(q[2]))s+=3});return s}
function scoreProject(){let s=0;let a=[/--partition=short|--partition short/,/--array=1-12%3|--array 1-12%3/,/--cpus-per-task=2|--cpus-per-task 2/,/--mem=4G|--mem 4G/,/--time=00:30:00|--time 00:30:00/,/%A_%a/,/SLURM_ARRAY_TASK_ID/,/fastqc/i];a.forEach(r=>{if(r.test(P1))s+=2});let b=[/--dependency=afterok:73001|--dependency afterok:73001/,/module load R/i,/Rscript summarize\.R/i,/--mem=4G|--mem 4G/,/--time=00:30:00|--time 00:30:00/,/--cpus-per-task=1|--cpus-per-task 1/];b.forEach(r=>{if(r.test(P2))s+=2});if(/sacct|seff/i.test(PD))s+=2;if(/oom|memory/i.test(PD))s+=2;if(/20G|20 GB|20480/i.test(PD))s+=2;if(/evidence|inspect|review/i.test(PD))s+=2;Object.values(TC).forEach(v=>{if(v)s+=1});return Math.min(40,s)}
function scoreTotal(){return Math.min(100,scoreQuestions()+scoreProject())}
function norm(x){return x.toLowerCase().replace(/\s+/g,' ').replace(/\s*=\s*/g,'=').trim()}
function simulate(c){if(/^sinfo\b/.test(c))return 'PARTITION AVAIL NODES STATE\nshort up 4 mix\ncompute up 6 idle\n[SIMULATED OUTPUT]';if(/^squeue\b/.test(c))return 'JOBID PARTITION NAME STATE\n73001 compute analysis R\n73002 short qc PD (Resources)\n[SIMULATED OUTPUT]';if(/^sacct\b/.test(c))return '73001 COMPLETED 00:18:42 8 14.2G\n[SIMULATED OUTPUT]';if(/^seff\s+73001/.test(c))return 'CPU Efficiency: 86%\nMemory Efficiency: 89%\n[SIMULATED EDUCATIONAL METRICS]';if(/^scontrol show job\s+73001/.test(c))return 'JobId=73001 JobState=RUNNING NumCPUs=8 ReqMem=16G\n[SIMULATED OUTPUT]';if(/^scancel\s+73001/.test(c))return 'Job 73001 cancelled in the local simulation only.';return 'REFERENCE-ONLY: not executed. Review purpose and adapt to your site documentation.'}
function loadScenario(id){if(id==='alignment')Object.assign(B,{job:'alignment',partition:'compute',cpus:'8',mem:'4G',time:'01:00:00',modules:'BWA\nSAMtools',command:'bwa mem -t "$SLURM_CPUS_PER_TASK" ref.fa reads.fq | samtools sort -o aligned.bam'});if(id==='array')Object.assign(B,{job:'fastq_qc',partition:'short',cpus:'2',mem:'4G',time:'00:30:00',array:'1-12%3',modules:'FastQC',command:'fastqc "reads/sample_${SLURM_ARRAY_TASK_ID}.fastq.gz"'});if(id==='dep')Object.assign(B,{job:'rna_summary',partition:'short',cpus:'1',mem:'4G',time:'00:30:00',dependency:'afterok:73001',modules:'R',command:'Rscript summarize.R results/ summary.tsv'});if(id==='pan')Object.assign(B,{job:'pangenome',partition:'compute',cpus:'8',mem:'16G',time:'02:00:00',modules:'Roary',command:'roary -p "$SLURM_CPUS_PER_TASK" -f results *.gff'});if(id==='gpu')Object.assign(B,{job:'gpu_md',partition:'gpu',cpus:'4',mem:'16G',time:'01:00:00',gpu:'gpu:1',modules:'CUDA',command:'python3 train.py --device cuda'});if(id==='time')Object.assign(B,{job:'long_job',partition:'compute',cpus:'4',mem:'8G',time:'01:00:00',command:'python3 long_analysis.py'});S.builderStep=0;nav('builder')}
function wire(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{S.lesson=+b.dataset.lesson;render();topNow()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();topNow()});let pl=document.querySelector('[data-prev-lesson]'),nl=document.querySelector('[data-next-lesson]');if(pl)pl.onclick=()=>{S.lesson=Math.max(0,S.lesson-1);render();topNow()};if(nl)nl.onclick=()=>{S.lesson=Math.min(12,S.lesson+1);render();topNow()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.cat=+b.dataset.cat;render();topNow()});let pc=document.querySelector('[data-prev-cat]'),nc=document.querySelector('[data-next-cat]');if(pc)pc.onclick=()=>{S.cat=Math.max(0,S.cat-1);render();topNow()};if(nc)nc.onclick=()=>{S.cat=Math.min(Object.keys(COMMANDS).length-1,S.cat+1);render();topNow()};document.querySelectorAll('[data-insert]').forEach(b=>b.onclick=()=>document.getElementById('cmd').value=b.dataset.insert);let run=document.getElementById('run');if(run)run.onclick=()=>{let i=document.getElementById('cmd'),c=i.value.trim();if(!c)return;let t=document.getElementById('term');t.innerHTML+=`\n<span class="prompt">sail-hpc:~$</span> ${esc(c)}\n${esc(simulate(c))}`;t.scrollTop=t.scrollHeight;i.value=''};document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>loadScenario(b.dataset.scenario));document.querySelectorAll('[data-bstep]').forEach(b=>b.onclick=()=>{S.builderStep=+b.dataset.bstep;render();topNow()});let pb=document.querySelector('[data-prev-builder]'),nb=document.querySelector('[data-next-builder]');if(pb)pb.onclick=()=>{S.builderStep=Math.max(0,S.builderStep-1);render();topNow()};if(nb)nb.onclick=()=>{S.builderStep=Math.min(3,S.builderStep+1);render();topNow()};document.querySelectorAll('[data-b]').forEach(e=>e.oninput=()=>{B[e.dataset.b]=e.value;let s=document.getElementById('script');if(s)s.textContent=scriptText()});document.querySelectorAll('input[name=qa]').forEach(e=>e.onchange=()=>S.answers[S.q]=e.value);let qt=document.getElementById('qaText');if(qt)qt.oninput=e=>S.answers[S.q]=e.target.value;let qp=document.querySelector('[data-qprev]'),qn=document.querySelector('[data-qnext]');if(qp)qp.onclick=()=>{S.q=Math.max(0,S.q-1);render();topNow()};if(qn)qn.onclick=()=>{if(S.q<19)S.q++;else S.stage='project';render();topNow()};let p1=document.getElementById('p1'),p2=document.getElementById('p2'),pd=document.getElementById('pd');if(p1)p1.oninput=e=>P1=e.target.value;if(p2)p2.oninput=e=>P2=e.target.value;if(pd)pd.oninput=e=>PD=e.target.value;document.querySelectorAll('[data-tc]').forEach(e=>e.onchange=()=>TC[e.dataset.tc]=e.checked);let pback=document.querySelector('[data-projback]'),pscore=document.querySelector('[data-projscore]');if(pback)pback.onclick=()=>{S.stage='questions';S.q=19;render();topNow()};if(pscore)pscore.onclick=()=>{S.stage='results';render();topNow()};let rb=document.querySelector('[data-resultback]'),cert=document.querySelector('[data-cert]');if(rb)rb.onclick=()=>{S.stage='project';render();topNow()};if(cert&&!cert.disabled)cert.onclick=()=>{S.stage='certificate';render();topNow()};}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.addEventListener('pageshow',topNow);window.addEventListener('load',()=>{render();topNow()});
</script>

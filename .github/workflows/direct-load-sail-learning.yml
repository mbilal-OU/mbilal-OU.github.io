name: Direct-load SAIL-HPC deep learning

on:
  push:
    paths:
      - .github/workflows/direct-load-sail-learning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Make deep learning a first-class top-level module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          token = "depth6-20260828"
          index = Path("sail-hpc/index.html")
          text = index.read_text()

          # Bump existing browser assets to a new immutable URL.
          text = re.sub(r'assets/css/sail\.css(?:\?v=[^"\s]+)?', f'assets/css/sail.css?v={token}', text)
          text = re.sub(r'src/ui/app\.js(?:\?v=[^"\s]+)?', f'src/ui/app.js?v={token}', text)
          text = re.sub(r'src/ui/script-launcher\.js(?:\?v=[^"\s]+)?', f'src/ui/script-launcher.js?v={token}', text)
          text = re.sub(r'src/ui/certificate-final\.js(?:\?v=[^"\s]+)?', f'src/ui/certificate-final.js?v={token}', text)

          direct = f'  <script type="module" src="src/ui/learning-depth.js?direct={token}"></script>\n'
          # Remove any previous direct loader so this operation is idempotent.
          text = re.sub(r'\s*<script type="module" src="src/ui/learning-depth\.js\?direct=[^"]+"></script>\s*', '\n', text)
          cert_line = f'  <script type="module" src="src/ui/certificate-final.js?v={token}"></script>'
          if cert_line not in text:
              raise SystemExit("certificate-final top-level script not found")
          text = text.replace(cert_line, direct + cert_line)
          index.write_text(text)

          cert = Path("sail-hpc/src/ui/certificate-final.js")
          c = cert.read_text()
          c = re.sub(r'^import\s+["\']\.\/learning-depth\.js[^"\']*["\'];\s*\n?', '', c, count=1, flags=re.M)
          c = re.sub(r'const DEPLOY_MARKER = "[^"]+";', f'const DEPLOY_MARKER = "{token}";', c)
          cert.write_text(c)

          depth = Path("sail-hpc/src/ui/learning-depth.js")
          d = depth.read_text()
          d = re.sub(r'link\.href = "assets/css/learning-depth\.css(?:\?v=[^"]+)?";', f'link.href = "assets/css/learning-depth.css?v={token}";', d)
          depth.write_text(d)

          Path("sail-hpc/DEPLOYMENT.txt").write_text(
              f"SAIL-HPC public preview asset token: {token}\n"
              "Deep learning loader: direct top-level module\n"
          )
          PY

      - name: Verify direct deep-learning loader
        run: |
          set -euo pipefail
          grep -q 'src/ui/learning-depth.js?direct=depth6-20260828' sail-hpc/index.html
          grep -q 'src/ui/app.js?v=depth6-20260828' sail-hpc/index.html
          grep -q 'src/ui/certificate-final.js?v=depth6-20260828' sail-hpc/index.html
          ! grep -q '^import .*learning-depth.js' sail-hpc/src/ui/certificate-final.js
          grep -q 'learning-depth.css?v=depth6-20260828' sail-hpc/src/ui/learning-depth.js
          grep -q 'Slurm Building Lab' sail-hpc/src/ui/learning-depth.js
          grep -q 'Commands, directives and real-cluster literacy' sail-hpc/src/ui/learning-depth.js

      - name: Commit direct-loader fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sail-hpc
          git commit -m "Load SAIL-HPC deep learning as a top-level module"
          git push
